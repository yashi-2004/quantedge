[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantedge"
version = "1.0.0"
description = "An End-to-End Quantitative Research, Portfolio Optimisation & Risk Analytics Platform"
readme = "README.md"
requires-python = ">=3.11, <3.13"
authors = [
    {name = "QuantEdge Research Team"}
]
keywords = [
    "quantitative-finance",
    "portfolio-optimization",
    "risk-analytics",
    "econometrics",
    "machine-learning",
    "deep-learning",
    "backtesting",
    "black-litterman"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning"
]
